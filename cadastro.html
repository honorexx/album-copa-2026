<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | Copa Stickers 2026</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

<main class="auth-page">

  <section class="auth-brand">
    <div class="world-ball">🏆</div>
    <h1>Monte seu álbum digital</h1>
    <p>Crie sua conta, salve seu progresso e acompanhe suas figurinhas da Copa 2026.</p>
  </section>

  <section class="auth-card">
    <span class="auth-tag">Novo colecionador</span>

    <h2>Criar conta</h2>
    <p class="auth-subtitle">Seu álbum ficará salvo no seu usuário.</p>

    <label>Nome completo</label>
    <input type="text" id="nome" placeholder="Seu nome completo">

    <label>CPF</label>
    <input type="text" id="cpf" placeholder="Opcional">

    <label>Telefone</label>
    <input type="text" id="telefone" placeholder="(00) 00000-0000">

    <label>Email</label>
    <input type="email" id="email" placeholder="seuemail@gmail.com">

    <label>Senha</label>
    <input type="password" id="senha" placeholder="Mínimo 6 caracteres">

    <button class="btn-auth" onclick="cadastro()">Criar meu álbum</button>

    <p class="auth-link">
      Já tem conta?
      <a href="login.html">Entrar</a>
    </p>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
async function cadastro(){
  const nome = document.getElementById("nome").value.trim();
  const cpf = document.getElementById("cpf").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value.trim();

  if(!nome || !email || !senha){
    alert("Preencha nome, email e senha.");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password: senha
  });

  if(error){
    alert(error.message);
    return;
  }

  const user = data.user;

  if(user){
    await supabaseClient
      .from("perfis")
      .insert({
        id: user.id,
        nome,
        cpf,
        telefone
      });
  }

  alert("Conta criada com sucesso! Agora faça login.");
  window.location.href = "login.html";
}
</script>

</body>
</html>
